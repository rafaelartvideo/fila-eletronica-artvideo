name: Deploy Union Fila

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-union-fila
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to HostGator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # react-router 8 / jsdom 30 require a newer Node 22 release.
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Check database contract
        run: npm run test:db-contract

      - name: Build the site
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Package print agent
        run: |
          mkdir -p dist/print-agent
          cp print-agent/agent.ps1 dist/print-agent/agent.ps1
          cp print-agent/setup.ps1 dist/print-agent/setup.ps1
          cp print-agent/config.example.json dist/print-agent/config.example.json
          cp print-agent/README.md dist/print-agent/README.md
          zip -j dist/print-agent/union-fila-print-agent.zip print-agent/agent.ps1 print-agent/setup.ps1 print-agent/config.example.json print-agent/README.md

      - name: Deploy dist to HostGator over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ./
          timeout: 120000
          log-level: minimal
